name: Deploy main branch

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    - name: create secrets json
      uses: jsdaniell/create-json@v1.2.3
      with:
        name: "secrets.json"
        json: '{"NODE_ENV": "${{ secrets.NODE_ENV }}", "PGHOST": "${{ secrets.PGHOST }}", "PGPORT": "${{ secrets.PGPORT }}", "PGDATABASE": "${{ secrets.PGDATABASE }}", "PGUSER": "${{ secrets.PGUSER }}", "PGPASSWORD": "${{ secrets.PGPASSWORD }}", "MAILUSER": "${{ secrets.MAILUSER }}", "MAILPASS": "${{ secrets.MAILPASS }}", "SECRETKEY": "${{ secrets.SECRETKEY }}", "LOGHOST": "${{ secrets.LOGHOST }}", "LOGPORT": "${{ secrets.LOGPORT }}", "LOGDATABASE": "${{ secrets.LOGDATABASE }}", "LOGUSER": "${{ secrets.LOGUSER }}", "LOGPASSWORD": "${{ secrets.LOGPASSWORD }}"}'
    - run: npm ci
    - name: serverless deploy
      uses: serverless/github-action@v3.2
      with:
        args: deploy
      env:
        #SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        # or if using AWS credentials directly
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}